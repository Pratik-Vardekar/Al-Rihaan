<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
    <defs>
        <radialGradient id="custGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#E8BA82" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#E8BA82" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bronzeUser" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D9A364"/>
            <stop offset="60%" stop-color="#8C5020"/>
            <stop offset="100%" stop-color="#4A280F"/>
        </linearGradient>
        <linearGradient id="goldUser" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE0B0"/>
            <stop offset="50%" stop-color="#D49A58"/>
            <stop offset="100%" stop-color="#8C5020"/>
        </linearGradient>
        <filter id="custShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#351F14" flood-opacity="0.18"/>
        </filter>
    </defs>
    <!-- Background Glow -->
    <circle cx="68" cy="65" r="48" fill="url(#custGlow)"/>

    <g filter="url(#custShadow)">
        <!-- Back Left Figure -->
        <g transform="translate(38, 38)">
            <circle cx="10" cy="10" r="9" fill="url(#bronzeUser)"/>
            <path d="M-2 38 C-2 24, 22 24, 22 38 Z" fill="url(#bronzeUser)"/>
        </g>

        <!-- Back Right Figure -->
        <g transform="translate(74, 38)">
            <circle cx="10" cy="10" r="9" fill="url(#bronzeUser)"/>
            <path d="M-2 38 C-2 24, 22 24, 22 38 Z" fill="url(#bronzeUser)"/>
        </g>

        <!-- Center Front Figure (Prominent Gold Luxury Finish) -->
        <g transform="translate(54, 46)">
            <!-- Head with Highlight -->
            <circle cx="14" cy="12" r="12" fill="url(#goldUser)"/>
            <path d="M8 8 C11 5, 17 5, 20 8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6"/>
            <!-- Body -->
            <path d="M-3 48 C-3 28, 31 28, 31 48 Z" fill="url(#goldUser)"/>
            <line x1="8" y1="36" x2="12" y2="48" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
        </g>
    </g>

    <!-- Sparkles -->
    <path d="M42 26 Q42 30 45 30 Q42 30 42 34 Q42 30 39 30 Q42 30 42 26 Z" fill="#E8CDA0"/>
    <path d="M98 34 Q98 37 100 37 Q98 37 98 40 Q98 37 96 37 Q98 37 98 34 Z" fill="#D4A373"/>
</svg>

