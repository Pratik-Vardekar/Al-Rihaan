<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
    <defs>
        <radialGradient id="orderGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#E8BA82" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#E8BA82" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bagPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E5B980"/>
            <stop offset="50%" stop-color="#C58C4E"/>
            <stop offset="100%" stop-color="#8F5926"/>
        </linearGradient>
        <linearGradient id="bagSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D9A364"/>
            <stop offset="100%" stop-color="#6E4018"/>
        </linearGradient>
        <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#351F14" flood-opacity="0.18"/>
        </filter>
    </defs>
    <!-- Background Glow -->
    <circle cx="68" cy="65" r="48" fill="url(#orderGlow)"/>

    <g filter="url(#bagShadow)">
        <!-- Back Bag (Smaller) -->
        <g transform="translate(36, 32)">
            <!-- Handle -->
            <path d="M12 14 C12 2, 26 2, 26 14" stroke="#4A2E19" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- Body -->
            <path d="M4 14 L34 14 L38 58 L0 58 Z" fill="url(#bagSecondary)"/>
            <path d="M4 14 L12 58 L0 58 Z" fill="#4A2E19" fill-opacity="0.25"/>
        </g>

        <!-- Front Bag (Larger Luxury Gift Bag) -->
        <g transform="translate(54, 40)">
            <!-- Rope Handles -->
            <path d="M16 14 C16 -2, 36 -2, 36 14" stroke="#351F14" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- Body -->
            <path d="M6 14 L46 14 L50 62 L2 62 Z" fill="url(#bagPrimary)"/>
            <!-- Side Crease Shade -->
            <path d="M6 14 L14 62 L2 62 Z" fill="#351F14" fill-opacity="0.22"/>
            <!-- Highlight Front -->
            <line x1="18" y1="18" x2="20" y2="58" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>
            <!-- Gold Foil Accent Line -->
            <line x1="14" y1="36" x2="42" y2="36" stroke="#FAF0DD" stroke-width="1.2" stroke-opacity="0.6"/>
            <!-- Little Gold Tag -->
            <rect x="22" y="24" width="8" height="12" rx="2" fill="#351F14" stroke="#E8CDA0" stroke-width="0.8"/>
        </g>
    </g>

    <!-- Sparkles -->
    <path d="M38 30 Q38 34 41 34 Q38 34 38 38 Q38 34 35 34 Q38 34 38 30 Z" fill="#E8CDA0"/>
    <path d="M102 46 Q102 49 104 49 Q102 49 102 52 Q102 49 100 49 Q102 49 102 46 Z" fill="#D4A373"/>
</svg>

