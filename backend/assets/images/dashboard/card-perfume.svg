<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
    <defs>
        <radialGradient id="perfumeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#E8BA82" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#E8BA82" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="perfumeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FAF5EE" stop-opacity="0.9"/>
            <stop offset="40%" stop-color="#F2D3A8" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#D49A58" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="liquidGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#8C5020"/>
            <stop offset="50%" stop-color="#C68032"/>
            <stop offset="100%" stop-color="#E5AA5D"/>
        </linearGradient>
        <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4A301E"/>
            <stop offset="35%" stop-color="#B3804A"/>
            <stop offset="70%" stop-color="#E8CDA0"/>
            <stop offset="100%" stop-color="#5C3B24"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#351F14" flood-opacity="0.18"/>
        </filter>
    </defs>
    <!-- Background Glow -->
    <circle cx="68" cy="65" r="48" fill="url(#perfumeGlow)"/>
    
    <!-- Bottle Body Shadow -->
    <g filter="url(#softShadow)">
        <!-- Perfume Liquid Base -->
        <rect x="42" y="44" width="52" height="60" rx="8" fill="url(#liquidGrad)"/>
        <!-- Inner Reflection Wave -->
        <path d="M42 58 Q 68 50 94 58 L94 96 Q 94 104 86 104 L50 104 Q 42 104 42 96 Z" fill="#9E5D24" fill-opacity="0.35"/>
        <line x1="68" y1="46" x2="68" y2="98" stroke="#E5AA5D" stroke-width="1.5" stroke-opacity="0.6"/>
        
        <!-- Glass Exterior Overlay -->
        <rect x="40" y="42" width="56" height="64" rx="9" fill="url(#perfumeGlass)" stroke="#C68032" stroke-width="1.5" stroke-opacity="0.4"/>
        
        <!-- Glass Highlights -->
        <path d="M44 48 L44 98" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.65"/>
        <path d="M48 48 L48 60" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
        
        <!-- Label Area -->
        <rect x="52" y="60" width="32" height="26" rx="3" fill="#351F14" fill-opacity="0.85" stroke="#E8CDA0" stroke-width="1"/>
        <line x1="56" y1="68" x2="80" y2="68" stroke="#E8CDA0" stroke-width="1"/>
        <line x1="60" y1="73" x2="76" y2="73" stroke="#D4A373" stroke-width="0.8"/>
        <line x1="62" y1="78" x2="74" y2="78" stroke="#E8CDA0" stroke-width="0.6"/>
        
        <!-- Atomizer Collar (Gold) -->
        <rect x="61" y="34" width="14" height="8" rx="2" fill="url(#goldCap)" stroke="#E8CDA0" stroke-width="0.5"/>
        
        <!-- Wooden/Gold Cap -->
        <rect x="54" y="16" width="28" height="18" rx="4" fill="url(#goldCap)"/>
        <rect x="56" y="18" width="24" height="14" rx="3" fill="#24140C" fill-opacity="0.3"/>
    </g>
    
    <!-- Sparkles -->
    <path d="M96 32 Q96 36 99 36 Q96 36 96 40 Q96 36 93 36 Q96 36 96 32 Z" fill="#E8CDA0"/>
    <path d="M36 70 Q36 73 38 73 Q36 73 36 76 Q36 73 34 73 Q36 73 36 70 Z" fill="#D4A373" opacity="0.8"/>
</svg>

